name: Update publications snapshot

on:
  schedule:
    - cron: "17 1 * * *" # daily, 06:47 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-publications.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/publications-snapshot.js; then
            echo "Snapshot unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/publications-snapshot.js
            git commit -m "Update publications snapshot from ORCID"
            git push
          fi
